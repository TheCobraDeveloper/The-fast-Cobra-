
name: Build THE FAST COBRA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'IMG-20261101-WA0634.jpg'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Cobra App Icon
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          import os

          source = "IMG-20261101-WA0634.jpg"
          target = "android/app/src/main/res/drawable/cobra_icon.png"

          if not os.path.exists(source):
              raise FileNotFoundError("Cobra logo image not found!")

          os.makedirs(os.path.dirname(target), exist_ok=True)
          image = Image.open(source).convert("RGBA")
          image = ImageOps.fit(image, (512, 512))
          image.save(target, "PNG")
          print("Cobra icon created successfully!")
          PY

      - name: Build APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-FAST-COBRA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
